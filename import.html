<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Data - Google Sheets → Firestore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #F1F5F9; color: #1E293B; padding: 16px; }
    .box { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; border: 1px solid #E2E8F0; }
    h1 { font-size: 1.25rem; margin-bottom: 16px; }
    .status { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 0.875rem; line-height: 1.5; }
    .status--info { background: #DBEAFE; color: #2563EB; }
    .status--success { background: #DCFCE7; color: #15803D; }
    .status--error { background: #FEE2E2; color: #DC2626; }
    .log { max-height: 300px; overflow-y: auto; font-size: 0.75rem; color: #64748B; margin-top: 12px; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px; }
    .log div { padding: 2px 0; border-bottom: 1px solid #F1F5F9; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .btn--primary { background: #3B82F6; color: white; }
    .btn--primary:hover { background: #2563EB; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar { height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; margin: 12px 0; }
    .progress-fill { height: 100%; background: #3B82F6; border-radius: 3px; transition: width 0.3s; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="box">
    <h1>Import Data: Google Sheets → Firestore</h1>

    <div id="status" class="status status--info">
      Nhấn nút bên dưới để bắt đầu import dữ liệu từ Google Sheets sang Firebase Firestore.
    </div>

    <div id="progress-wrap" class="hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <button class="btn btn--primary" id="btn-import" onclick="runImport()">
      Bắt đầu Import
    </button>

    <div class="log" id="log"></div>
  </div>

  <!-- Google Sheets API (cũ) -->
  <script>
    var OLD_API = 'https://script.google.com/macros/s/AKfycbztkR8nDVcauoqgMBhPJPuc3ySWlqohnLMq5otm7JpRTqxxLARBkRKRwaIlOOlRB-I7qQ/exec';
  </script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDbvPwm6kkVFnVku58gTxDqErrArOtwoW4",
      authDomain: "webtiengtrung-dc859.firebaseapp.com",
      projectId: "webtiengtrung-dc859",
      storageBucket: "webtiengtrung-dc859.firebasestorage.app",
      messagingSenderId: "107116057590",
      appId: "1:107116057590:web:97790b47cc02fb3de8add7"
    });
    var db = firebase.firestore();
  </script>

  <script>
    function log(msg) {
      var el = document.getElementById('log');
      var div = document.createElement('div');
      div.textContent = msg;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    function setProgress(current, total) {
      var pct = Math.round((current / total) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    async function runImport() {
      var btn = document.getElementById('btn-import');
      var statusEl = document.getElementById('status');
      var progressWrap = document.getElementById('progress-wrap');

      btn.disabled = true;
      btn.textContent = 'Đang import...';
      progressWrap.classList.remove('hidden');
      statusEl.className = 'status status--info';
      statusEl.textContent = 'Đang lấy dữ liệu từ Google Sheets...';

      try {
        // 1. Lấy dữ liệu từ Google Sheets
        log('Đang kết nối Google Sheets...');
        var res = await fetch(OLD_API + '?action=words');
        var data = await res.json();
        var words = data.words || [];

        if (words.length === 0) {
          statusEl.className = 'status status--error';
          statusEl.textContent = 'Không tìm thấy dữ liệu nào trên Google Sheets.';
          btn.disabled = false;
          btn.textContent = 'Thử lại';
          return;
        }

        log('Tìm thấy ' + words.length + ' từ. Bắt đầu import vào Firestore...');
        statusEl.textContent = 'Đang import ' + words.length + ' từ vào Firestore...';

        // 2. Import từng từ vào Firestore
        var success = 0;
        var failed = 0;

        for (var i = 0; i < words.length; i++) {
          var word = words[i];
          try {
            var id = word.id || (Date.now().toString(36) + Math.random().toString(36).substr(2, 9));
            var docData = {
              hanzi: word.hanzi || '',
              pinyin: word.pinyin || '',
              meaning: word.meaning || '',
              example: word.example || '',
              examplePinyin: word.examplePinyin || '',
              exampleMeaning: word.exampleMeaning || '',
              category: word.category || '',
              favorite: word.favorite === true || word.favorite === 'TRUE',
              level: parseInt(word.level) || 0,
              correctStreak: parseInt(word.correctStreak) || 0,
              wrongCount: parseInt(word.wrongCount) || 0,
              lastReview: word.lastReview || '',
              nextReview: word.nextReview || '',
              createdAt: word.createdAt || new Date().toISOString(),
            };

            await db.collection('words').doc(id).set(docData);
            success++;
            log('✓ [' + (i + 1) + '/' + words.length + '] ' + word.hanzi);
          } catch (err) {
            failed++;
            log('✗ [' + (i + 1) + '/' + words.length + '] ' + word.hanzi + ' - ' + err.message);
          }

          setProgress(i + 1, words.length);
        }

        // 3. Kết quả
        statusEl.className = 'status status--success';
        statusEl.innerHTML = '<strong>Import xong!</strong><br>' +
          'Thành công: <strong>' + success + '</strong> từ<br>' +
          'Thất bại: <strong>' + failed + '</strong> từ';
        log('Hoàn thành! ' + success + ' thành công, ' + failed + ' thất bại.');
        btn.textContent = 'Import lại';

      } catch (err) {
        statusEl.className = 'status status--error';
        statusEl.textContent = 'Lỗi: ' + err.message;
        log('Lỗi: ' + err.message);
      }

      btn.disabled = false;
    }
  </script>

</body>
</html>
